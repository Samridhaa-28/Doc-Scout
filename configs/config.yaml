# DocScout-X configuration. All settings live here; secrets live in .env.
# Paths are relative to the repo root and resolved to absolute paths by docscout.config.

paths:
  data_dir: data
  raw_dir: data/raw
  mpdocvqa_dir: data/raw/mpdocvqa
  mpdocvqa_images_dir: data/raw/mpdocvqa/images
  questions_file: data/raw/mpdocvqa/questions.jsonl
  pdfs_dir: data/raw/pdfs
  processed_dir: data/processed
  components_file: data/processed/components.jsonl
  tables_dir: data/processed/tables
  figures_dir: data/processed/figures
  graphs_dir: data/processed/graphs
  debug_dir: data/processed/debug
  docs_dir: data/processed/docs            # per-document manifest (pages, sizes, image paths)
  pages_dir: data/processed/pages          # demo-PDF pages rendered at parsing.image_dpi
  combined_pdfs_dir: data/processed/mpdocvqa_pdfs   # MP-DocVQA page PNGs joined into one PDF
  indexes_dir: data/indexes
  eval_dir: eval
  results_dir: eval/results
  reports_dir: docs/reports

# Separate stores: DOCSCOUT_STORE=<name> (or --store <name> on scripts) replaces these paths, so the demo
# PDFs get their own components, graphs, tables and indexes (and BM25 statistics); the eval store is untouched.
stores:
  demo:
    processed_dir: data/processed/demo
    components_file: data/processed/demo/components.jsonl
    tables_dir: data/processed/demo/tables
    figures_dir: data/processed/demo/figures
    graphs_dir: data/processed/demo/graphs
    debug_dir: data/processed/demo/debug
    docs_dir: data/processed/demo/docs
    pages_dir: data/processed/demo/pages
    indexes_dir: data/indexes_demo

dataset:
  hf_name: lmms-lab/MP-DocVQA      # fallback: rubentito/mp-docvqa
  split: val
  subset_size: 150                 # number of documents for the eval subset

parsing:
  ocr: true
  ocr_backend: onnxruntime         # RapidOCR backend: onnxruntime | torch
  pdf_backend:                     # Docling PDF backend per source: pypdfium2 | docling_parse
    mpdocvqa: pypdfium2            # image-only joined PDFs: no text layer; docling_parse crashed natively on zrhw0228
    pdf: docling_parse             # digital demo PDFs: keep Docling's default text-cell parser
  image_dpi: 144                   # demo PDFs: render DPI; their bboxes are in pixels at this DPI
  mpdocvqa_dpi: 200                # nominal DPI used to size PDF pages built from MP-DocVQA PNGs
                                   # (bboxes for MP-DocVQA are in original PNG pixels)
  max_text_form_tokens: 512
  caption_max_gap: 0.15            # nearest-caption fallback: max vertical gap as a fraction of page height
  num_threads: 8

models:
  bge: BAAI/bge-base-en-v1.5
  minilm: sentence-transformers/all-MiniLM-L6-v2
  clip: clip-ViT-B-32
  cross_encoder: cross-encoder/ms-marco-MiniLM-L-6-v2
  bge_query_instruction: "Represent this sentence for searching relevant passages: "
  device: cpu
  batch_size: 32

branches:
  text: [paragraph, heading, caption]
  table: [table]
  figure: [figure]

retrieval:
  top_k:                            # candidates taken from each retriever per branch
    bm25: 50
    dense_bge: 50
    dense_minilm: 50
    clip: 20
  rerank_top_n: 30
  final_top_k: 5

fusion:
  method: weighted_sum              # weighted_sum (main) | rrf (comparison)
  normalization: minmax             # minmax | zscore
  rrf_k: 60
  # Tuned on the DEV split only (eval/tune_fusion.py, eval/results/tuning.json; P5).
  # Objective = mean(dev page MRR on docs >= 2 pages, dev component MRR): 0.4753 before -> 0.5133 after.
  retriever_weights:                # within a branch, after normalization; renormalized over the branch's retrievers
    bm25: 0.7
    dense: 0.3                      # BGE (= 1 - bm25)
    clip: 0.3                       # figure branch only (fixed, not tuned)
  branch_weights:                   # soft routing: all branches searched, label sets weights
    textual:   {text: 0.4, table: 0.375, figure: 0.225}
    numerical: {text: 0.3, table: 0.6,   figure: 0.1}
    visual:    {text: 0.25, table: 0.15, figure: 0.6}

classifier:
  use_llm: true
  rule_confidence: 0.9              # confidence reported when exactly one rule group matches
  unsure_fallback: textual          # label used when rules are unsure and the LLM is off / fails

localization:                      # table value localization (numerical queries, table components only)
  fuzzy_threshold: 85               # rapidfuzz ratio (0-100) for a query word vs a header / row-label word
  min_fuzzy_len: 4                  # shorter words, numbers, years and units must match exactly as tokens
  max_cells: 12                     # cells returned / shown at most
  top_k_tables: 3                   # localize at most this many tables (the first ones among the top-k evidence)

context:                           # graph context expansion
  max_siblings: 2                   # reading-order neighbours per evidence item (same page preferred)
  sibling_window: 3                 # look this many blocks back/forward for siblings

answer:                            # grounded answer generation
  max_prompt_tokens: 2500           # estimated tokens (chars / 4) for the whole prompt; keeps us under 8,000 TPM
  chars_per_token: 4.0
  max_item_chars: 1200              # text of one evidence item
  max_ctx_chars: 300                # text of one context item
  max_table_rows: 6                 # table without localized cells: first rows shown
  not_found: "Not found in the retrieved evidence"
  slots: conditional                # modality slot reservation: off | conditional | both (retrieval/slots.py); adopted on DEV by the pre-registered rule, P6 report 2.10 / 4.10

feedback:
  step: 0.05                       # added to rerank score per preference count
  cap: 0.2                          # max absolute boost/penalty

llm:
  provider: groq
  model: openai/gpt-oss-20b         # overridden by LLM_MODEL in .env if set
  demo_model: openai/gpt-oss-120b   # used only by scripts.ask --demo (never in evaluation)
  tokens_per_minute: 7000           # client-side token budget per rolling 60 s (Groq free tier: 8,000 TPM)
  temperature: 0.0
  max_tokens: 512
  max_retries: 5                    # retries on 429 / 5xx / connection errors
  backoff_base_s: 2.0               # wait = backoff_base_s * 2**attempt (or Retry-After if larger)
  backoff_max_s: 60.0
  max_retry_after_s: 900             # a server Retry-After (e.g. rolling daily token quota) is waited out up to this
  min_interval_s: 2.1               # minimum gap between real API calls (Groq free tier: 30 requests/min)
  timeout_s: 30
  reasoning_effort: low             # sent only to reasoning models (openai/gpt-oss-*); fewer hidden tokens
  cache_path: data/processed/llm_cache.jsonl

eval:
  k_values: [1, 5, 10]
  metrics: [recall@1, recall@5, recall@10, mrr, ndcg@10]
  subset_size: 150
  dev_fraction: 0.2                 # fraction of DOCUMENTS in the dev split (tuning only)
  split_file: eval/results/split.json
  anls_threshold: 0.5
  fuzzy_match_threshold: 90
  seed: 42

api:
  host: 127.0.0.1
  port: 8000
  base_url: http://127.0.0.1:8000
